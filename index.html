<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Landing Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f7fa;
      color: #333;
      line-height: 1.6;
    }

    header {
      background: #1e90ff;
      color: white;
      padding: 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 2.5rem;
    }

    nav {
      margin-top: 1rem;
    }

    nav a {
      color: white;
      margin: 0 1rem;
      text-decoration: none;
      font-weight: bold;
    }

    section.hero {
      text-align: center;
      padding: 4rem 2rem;
      background: white;
    }

    section.hero h2 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    section.hero p {
      font-size: 1.1rem;
      color: #555;
    }

    button.cta {
      margin-top: 2rem;
      padding: 0.75rem 2rem;
      background-color: #1e90ff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button.cta:hover {
      background-color: #0d6efd;
    }

    footer {
      text-align: center;
      padding: 2rem;
      background: #222;
      color: #ccc;
      margin-top: 2rem;
    }

    @media (min-width: 768px) {
      section.hero h2 {
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>My Awesome Website</h1>
    <nav>
      <a href="#features">Features</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <h2>Welcome to the Future of Web</h2>
    <p>Discover innovative solutions and explore endless possibilities with our platform.</p>
    <button class="cta" onclick="showMessage()">Get Started</button>
  </section>

  <footer>
    &copy; 2025 My Awesome Website. All rights reserved.
  </footer>

  <script>
    function showMessage() {
      alert("Thanks for getting started with us!");
    }
  </script>
</body>
</html>
